name: Rules and architecture

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore LethalDungeon.sln --locked-mode
      - name: Build
        id: build
        run: dotnet build LethalDungeon.sln --configuration Release --no-restore
      - name: Check architecture and workflow
        run: dotnet test tests/Architecture.Tests/Architecture.Tests.csproj --configuration Release --no-build --no-restore --logger 'trx;LogFileName=architecture.trx' --results-directory evidence/latest
      - name: Check domain rules
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test tests/Domain.Tests/Domain.Tests.csproj --configuration Release --no-build --no-restore --logger 'trx;LogFileName=domain.trx' --results-directory evidence/latest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: evidence/latest/**/*.trx
          retention-days: 14
          if-no-files-found: warn
